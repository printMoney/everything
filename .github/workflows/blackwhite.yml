name: Build BlackWhite DMG

on:
  push:
    paths:
      - "blackwhite/**"
      - ".github/workflows/blackwhite.yml"
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-14 # Apple Silicon runner
    steps:
      - uses: actions/checkout@v4
      - name: Build DMG
        run: ./blackwhite/build-dmg.sh
      - uses: actions/upload-artifact@v4
        with:
          name: BlackWhite-dmg
          path: blackwhite/dist/BlackWhite.dmg
